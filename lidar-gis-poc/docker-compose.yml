services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: poc
      POSTGRES_USER: poc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-poc}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U poc -d poc"]
      interval: 5s
      retries: 15
  api:
    build: ./backend
    ports: ["127.0.0.1:8000:8000"]
    environment:
      DATABASE_URL: postgresql+psycopg://poc:${POSTGRES_PASSWORD:-poc}@db:5432/poc
      UPLOAD_DIR: /data/uploads
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
volumes:
  pgdata:
  uploads:
